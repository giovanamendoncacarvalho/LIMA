<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_Interno</title>
    <!-- Declação do CSS interno -->
    <style>
        h1{
            color:rgb(180, 39, 156);
            text-align: center;
            background-color: violet;
            font-size: 50px;
        }
        h2{
            color:rgb(180, 39, 156);
            text-align: center;
            background-color: violet;
            font-size: 50px;
        }
        p{
            font-size: 36px;
            text-align: center;
        }
        .fonte{
            font-size: 50px;
            text-align: center;
        }
                    :hover{
                color:rgb(155, 8, 74);
                font-size: 50px;
            }
    </style>
</head>
<body>
    <h1>Giovana Mendonça Carvalho</h1>
    <p>Estudante de Desenvolvimento de Sistemas</p>
    <p>Lista de cursos</p>
    <h2 class="fonte">Lista de Cursos Transversais</h2>
</body>
</html>
